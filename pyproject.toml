[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-esa-agents"
version = "0.5.3"
description = "Standalone LangGraph agent graphs for EVE / Pi School backends"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Keep upper bounds conservative so `pip install eve-esa-agents` into an app that
# pins langgraph==1.0.x does not pull langgraph 1.1+ and a different langchain-core.
dependencies = [
    "langchain-core>=0.3,<2",
    "langgraph>=1.2,<2",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "tiktoken>=0.6,<1",
    "httpx>=0.27,<1",
    "pystac-client>=0.8,<1",
]

[project.optional-dependencies]
dev = [
    "langchain-groq>=1.0,<2",
    "langchain-openai>=1,<2",  # Ollama / vLLM / OpenRouter / HF via the OpenAI-compatible API
    "python-dotenv>=1,<2",
    "streamlit>=1.24,<2",
    "folium>=0.15,<1",
    "streamlit-folium>=0.20,<1",
    "mcp>=1.2,<2",
    "langchain-mcp-adapters>=0.1,<1",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "langgraph-checkpoint-sqlite>=3,<4",
    "a2a-sdk>=1.2,<2",  # A2A client: the EO agent calls the TerraMind agent
]

# TerraMind A2A agent (terramind_agent/): one environment, no conda. Install with
#   pip install -e ".[dev,terramind]"
terramind = [
    "torch>=2.2",
    "terratorch>=1.2,<2",
    # rasterio 1.5 ships no wheels (it builds against a system GDAL); 1.4.x wheels bundle GDAL,
    # which is what removes the need for conda-forge GDAL.
    "rasterio>=1.4,<1.5",
    "a2a-sdk[http-server]>=1.2,<2",
    "uvicorn>=0.29,<1",
]

[project.urls]
Homepage = "https://github.com/eve-esa/agents"
Repository = "https://github.com/eve-esa/agents"

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.setuptools.package-data]
"agents.graphs.react" = ["prompts.yaml"]
"agents.graphs.simple" = ["prompts.yaml"]
